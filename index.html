  <body>
    <script>
      (function () {
        try {
          var key = "sage-theme";
          var pref = localStorage.getItem(key);
          var dark =
            pref === "dark" ||
            (pref !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <div id="root">
      <div
        id="boot-splash"
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
          font-family: system-ui, -apple-system, 'PingFang SC', sans-serif;
          font-size: 14px;
          color: #64748b;
          background: #f9fafb;
        "
      >
        加载中…
      </div>
    </div>
    <script>
      (function () {
        var BOOT_SLOW_MS = 12000;
        var BOOT_FAIL_MS = 60000;

        function showBootFail(title, hint) {
          var root = document.getElementById("root");
          if (!root || !document.getElementById("boot-splash")) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:system-ui,-apple-system,\'PingFang SC\',sans-serif;background:#f9fafb;color:#334155">' +
            '<p style="font-size:16px;font-weight:600;margin:0 0 8px">' +
            title +
            "</p>" +
            '<p style="font-size:13px;line-height:1.6;color:#64748b;margin:0">' +
            (hint ||
              "微信内可能无法完整加载。请点右上角 ··· →「在浏览器中打开」，或用 Safari / Chrome 访问 sageteach.top") +
            "</p>" +
            '<button type="button" onclick="location.reload()" style="margin-top:20px;padding:10px 18px;border:0;border-radius:10px;background:#0f172a;color:#fff;font-size:14px">刷新重试</button></div>';
        }

        function updateSplash(text) {
          var el = document.getElementById("boot-splash");
          if (el) el.textContent = text;
        }

        var scriptRetried = false;
        window.__sageLoadEntry = function (src) {
          function attach(retry) {
            var el = document.createElement("script");
            el.type = "module";
            el.src = retry
              ? src + (src.indexOf("?") >= 0 ? "&" : "?") + "cb=" + Date.now()
              : src;
            el.addEventListener(
              "error",
              function () {
                if (!scriptRetried) {
                  scriptRetried = true;
                  updateSplash("资源加载失败，正在重试…");
                  attach(true);
                  return;
                }
                showBootFail(
                  "页面加载失败",
                  "可能是微信缓存了旧版本，或网络中断。请点右上角 ··· →「在浏览器中打开」，或用 Safari / Chrome 访问 sageteach.top；也可清除微信缓存后重试。",
                );
              },
              { once: true },
            );
            document.body.appendChild(el);
          }
          attach(false);
        };

        setTimeout(function () {
          updateSplash("网络较慢，仍在加载…");
        }, BOOT_SLOW_MS);

        setTimeout(function () {
          if (document.getElementById("boot-splash")) {
            showBootFail(
              "加载超时",
              "首屏资源较大，弱网或微信内可能超过 1 分钟。建议点右上角 ··· →「在浏览器中打开」，或用 Safari / Chrome 访问 sageteach.top",
            );
          }
        }, BOOT_FAIL_MS);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
